<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 230" width="860" height="230" role="img" aria-label="After resolution the two pushed values are removed and main's return address is back on top">
  <title>The stack after resolution completes</title>
  <style>
    text{font-family:ui-sans-serif,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#0f172a}
    .cap{font-size:12.5px;font-weight:600;fill:#475569;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font-size:12.5px;fill:#475569}
  </style>
  <rect width="860" height="230" fill="#ffffff"/>
  <text class="cap" x="60" y="34">high address</text>

  <rect x="60" y="42" width="280" height="46" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text class="mono" x="78" y="70">main's return addr</text>
  <text class="s" x="364" y="62">top of stack (RSP)</text>
  <text class="s" x="364" y="80">pushed at T0, still there through T6 to T12</text>

  <rect x="60" y="88" width="280" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="mono" x="78" y="114">...</text>

  <text class="cap" x="60" y="158">low address</text>
  <text class="s" x="60" y="190">The resolver removed the reloc index and link_map ptr it had pushed,</text>
  <text class="s" x="60" y="210">so ret from add returns correctly to main.</text>
</svg>
