<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" role="img" aria-label="仮想アドレス空間に main の4つの PT_LOAD と ld-linux.so の2つの PT_LOAD が ASLR で決まる base から並ぶ">
  <title>仮想アドレス空間の全体像</title>
  <style>
    text{font-family:ui-sans-serif,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#0f172a}
    .cap{font-size:12.5px;font-weight:600;fill:#475569;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font-size:12.5px;fill:#475569}
  </style>
  <rect width="860" height="460" fill="#ffffff"/>
  <text class="cap" x="170" y="42" text-anchor="end">低位</text>

  <rect x="180" y="50" width="380" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="s" x="370" y="80" text-anchor="middle">(空き)</text>

  <g stroke="#2563eb" stroke-width="1.5">
    <rect x="180" y="100" width="380" height="34" fill="#f8fafc"/>
    <rect x="180" y="134" width="380" height="34" fill="#eff6ff"/>
    <rect x="180" y="168" width="380" height="34" fill="#ecfdf5"/>
    <rect x="180" y="202" width="380" height="48" fill="#fffbeb"/>
  </g>
  <text class="mono" x="196" y="122">main: LOAD#1  R--</text>
  <text class="mono" x="196" y="156">main: LOAD#2  R-X  .text</text>
  <text class="mono" x="196" y="190">main: LOAD#3  R--  .rodata</text>
  <text class="mono" x="196" y="222">main: LOAD#4  RW-  .got</text>
  <text class="mono" x="336" y="242">.data .bss</text>
  <text class="cap" x="170" y="105" text-anchor="end">base_main</text>
  <text class="s" x="576" y="105">ASLR で決まる</text>

  <rect x="180" y="250" width="380" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="s" x="370" y="280" text-anchor="middle">(空き)</text>

  <g stroke="#7c3aed" stroke-width="1.5">
    <rect x="180" y="300" width="380" height="34" fill="#f5f3ff"/>
    <rect x="180" y="334" width="380" height="34" fill="#f5f3ff"/>
  </g>
  <text class="mono" x="196" y="322">ld-linux.so: LOAD#1  R-X</text>
  <text class="mono" x="196" y="356">ld-linux.so: LOAD#2  RW-</text>
  <text class="cap" x="170" y="305" text-anchor="end">base_ld</text>
  <text class="s" x="576" y="305">これも ASLR で決まる</text>

  <rect x="180" y="368" width="380" height="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 3"/>
  <text class="s" x="370" y="394" text-anchor="middle">(空き)</text>

  <text class="cap" x="170" y="434" text-anchor="end">高位</text>
</svg>
