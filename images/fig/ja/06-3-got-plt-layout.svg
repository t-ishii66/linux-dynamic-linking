<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" width="900" height="340" role="img" aria-label="got.plt は uint64 の配列で、先頭3つが予約スロット、4つ目以降が1関数につき1スロット">
  <title>.got.plt の中身: 先頭 3 つは予約、[3] 以降が関数用スロット</title>
  <style>
    text{font-family:ui-sans-serif,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13.5px;fill:#0f172a}
    .cap{font-size:13px;font-weight:600;fill:#475569;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font-size:12.5px;fill:#475569}
    .tag{font-size:11.5px;font-weight:600;fill:#64748b}
  </style>
  <rect width="900" height="340" fill="#ffffff"/>
  <text class="cap" x="40" y="28">.got.plt   (uint64 の配列)</text>

  <!-- reserved bracket -->
  <path d="M32 42 L24 42 L24 180 L32 180" fill="none" stroke="#94a3b8" stroke-width="1.3"/>
  <text class="tag" x="18" y="115" text-anchor="middle" transform="rotate(-90 18 115)">予約 3 スロット</text>

  <!-- slots -->
  <g stroke="#94a3b8" stroke-width="1.4">
    <rect x="40" y="42"  width="300" height="46" fill="#f1f5f9"/>
    <rect x="40" y="88"  width="300" height="46" fill="#f1f5f9"/>
    <rect x="40" y="134" width="300" height="46" fill="#f1f5f9"/>
  </g>
  <g stroke="#d97706" stroke-width="1.6">
    <rect x="40" y="180" width="300" height="46" fill="#fef3c7"/>
    <rect x="40" y="226" width="300" height="46" fill="#fffbeb"/>
  </g>
  <rect x="40" y="272" width="300" height="34" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="5 3"/>

  <text class="mono" x="58" y="71">[0]  &amp;.dynamic</text>
  <text class="mono" x="58" y="117">[1]  link_map ポインタ</text>
  <text class="mono" x="58" y="163">[2]  _dl_runtime_resolve</text>
  <text class="mono" x="58" y="209">[3]  add のアドレス</text>
  <text class="mono" x="58" y="255">[4]  printf のアドレス</text>
  <text class="mono" x="58" y="294">...</text>

  <!-- annotations -->
  <text class="s" x="366" y="71">.dynamic セクションのアドレス (静的リンカが書き込む)</text>
  <text class="s" x="366" y="110">ld-linux.so が起動時に書き込む</text>
  <text class="s" x="366" y="128">(link_map は Step 7 で詳述)</text>
  <text class="s" x="366" y="156">ld-linux.so が起動時に書き込む</text>
  <text class="s" x="366" y="174">= アドレス解決ルーチン (resolver) 本体のアドレス</text>
  <text class="s" x="366" y="203">初期値は PLT 内を指す add@plt+6</text>
  <text class="s" x="366" y="221">初回呼び出し時に実アドレスへ書き換わる</text>
  <text class="s" x="366" y="255">(もし printf を使っていれば)</text>
  <text class="s" x="366" y="294">使う関数の数だけ並ぶ</text>

</svg>
