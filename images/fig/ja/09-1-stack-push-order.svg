<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-label="スタックは高アドレス側から低アドレス側へ伸び、最後に push したものが先頭になる">
  <title>スタックの伸びる向きと push の順序</title>
  <style>
    text{font-family:ui-sans-serif,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#0f172a}
    .cap{font-size:12.5px;font-weight:600;fill:#475569;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font-size:12.5px;fill:#475569}
  </style>
  <rect width="760" height="250" fill="#ffffff"/>
  <text class="cap" x="80" y="34">高アドレス</text>

  <rect x="80" y="42" width="120" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="mono" x="130" y="69" text-anchor="middle">A</text>
  <text class="s" x="224" y="69">最初に push したもの</text>

  <rect x="80" y="84" width="120" height="42" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="mono" x="130" y="111" text-anchor="middle">B</text>
  <text class="s" x="224" y="111">次に push したもの</text>

  <rect x="80" y="126" width="120" height="42" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text class="mono" x="130" y="153" text-anchor="middle">C</text>
  <text class="s" x="224" y="153">最後に push したもの (= 現在の先頭)</text>

  <text class="cap" x="80" y="198">低アドレス</text>
  <text class="s" x="80" y="228">push するほどアドレスは小さくなる。図の下ほど新しい。</text>
</svg>
