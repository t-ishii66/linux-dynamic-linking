<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330" role="img" aria-label="登場するのはカーネル、動的リンカ ld-linux.so、実行ファイル main、共有ライブラリ libmylib.so の 4 つ">
  <title>全体像: 動的リンクに登場する 4 者</title>
  <style>
    text{font-family:ui-sans-serif,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:14px;fill:#0f172a}
    .s{font-size:12.5px;fill:#475569}
  </style>
  <rect width="860" height="330" fill="#ffffff"/>

  <rect x="40" y="30" width="300" height="58" rx="5" fill="#f1f5f9" stroke="#64748b" stroke-width="1.6"/>
  <text class="mono" x="58" y="64">Kernel (Linux)</text>
  <text class="s" x="364" y="54">ELF を解釈してメモリにマップし、</text>
  <text class="s" x="364" y="74">制御を ld-linux.so に渡す</text>

  <rect x="40" y="108" width="300" height="58" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text class="mono" x="58" y="132">Dynamic Linker</text>
  <text class="mono" x="58" y="154">"ld-linux.so"</text>
  <text class="s" x="364" y="132">実体は /lib64/ld-linux-x86-64.so.2</text>
  <text class="s" x="364" y="154">依存ライブラリのロードとシンボル解決を担う</text>

  <rect x="40" y="186" width="300" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text class="mono" x="58" y="213">main (ELF)</text>
  <text class="s" x="364" y="213">私たちが書いた実行ファイル</text>

  <rect x="40" y="250" width="300" height="44" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text class="mono" x="58" y="277">libmylib.so (ELF)</text>
  <text class="s" x="364" y="277">私たちが書いた共有ライブラリ</text>
</svg>
