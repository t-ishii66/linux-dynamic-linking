<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 548" width="900" height="548" role="img" aria-label="起動時スタックは低位から argc、argv、envp、auxv、文字列実体の順に積まれている">
  <title>プロセス起動時の初期スタック</title>
  <style>
    text{font-family:ui-sans-serif,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#0f172a}
    .cap{font-size:12.5px;font-weight:600;fill:#475569;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    .s{font-size:12.5px;fill:#475569}
  </style>
  <rect width="900" height="548" fill="#ffffff"/>
  <text class="cap" x="120" y="34">高アドレス</text>

  <rect x="120" y="42" width="330" height="52" fill="#f8fafc" stroke="#64748b" stroke-width="1.5"/>
  <text class="s" x="136" y="64">(env 文字列 の実体)</text>
  <text class="s" x="136" y="84">(arg 文字列 の実体)</text>
  <text class="mono" x="472" y="64">"PATH=/usr/bin\0" など</text>
  <text class="mono" x="472" y="84">"./main\0"</text>

  <rect x="120" y="94" width="330" height="178" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text class="mono" x="136" y="116">Auxiliary Vector (auxv)</text>
  <text class="mono" x="152" y="136">AT_NULL,  0</text>
  <text class="mono" x="152" y="156">...</text>
  <text class="mono" x="152" y="176">AT_ENTRY, base_main+0x1050</text>
  <text class="mono" x="152" y="196">AT_BASE,  base_ld</text>
  <text class="mono" x="152" y="216">AT_PHNUM, 13</text>
  <text class="mono" x="152" y="236">AT_PHENT, 56</text>
  <text class="mono" x="152" y="256">AT_PHDR,  &amp;main_phdr</text>
  <text class="s" x="472" y="176">= 実 VA、PIE のため base 加算</text>
  <text class="s" x="472" y="116">動的リンカが重要視する (中身は次節)</text>

  <rect x="120" y="272" width="330" height="100" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="mono" x="136" y="294">envp[N] = NULL</text>
  <text class="mono" x="136" y="314">envp[N-1] = "PATH=..."</text>
  <text class="mono" x="136" y="334">...</text>
  <text class="mono" x="136" y="354">envp[0]</text>

  <rect x="120" y="372" width="330" height="100" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text class="mono" x="136" y="394">argv[argc] = NULL</text>
  <text class="mono" x="136" y="414">argv[argc-1]</text>
  <text class="mono" x="136" y="434">...</text>
  <text class="mono" x="136" y="454">argv[0] = "./main"</text>

  <rect x="120" y="472" width="330" height="34" fill="#dbeafe" stroke="#2563eb" stroke-width="1.8"/>
  <text class="mono" x="136" y="494">argc</text>
  <text class="s" x="472" y="494">RSP はここを指している</text>

  <text class="cap" x="120" y="534">低アドレス</text>
</svg>
