<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" role="img" aria-label="ビルド時のリンク指定が DT_NEEDED として ELF に固定され、起動時のロード順と lookup scope を決め、初回呼び出し時の検索順になる">
  <title>ビルド時の指定から実行時の検索順序までの流れ</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <style>
    text{font-family:ui-sans-serif,-apple-system,"Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
    .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;fill:#0f172a}
    .ph{font-size:11.5px;font-weight:700;fill:#334155}
    .actor{font-size:13.5px;font-weight:600;fill:#0f172a}
    .s{font-size:12.5px;fill:#475569}
    .a{stroke:#334155;stroke-width:1.8;fill:none;marker-end:url(#ah)}
  </style>
  <rect width="940" height="470" fill="#ffffff"/>

  <text class="ph" x="30" y="64">[ビルド時]</text>
  <rect x="170" y="38" width="200" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text class="actor" x="270" y="65" text-anchor="middle">開発者</text>
  <text class="mono" x="394" y="58">gcc ... -lmylib</text>
  <text class="s" x="394" y="76">どの .so を、どの順で使うか</text>

  <path class="a" d="M270 82 L270 112"/>

  <rect x="170" y="112" width="200" height="44" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text class="actor" x="270" y="139" text-anchor="middle">静的リンカ ld</text>
  <text class="s" x="394" y="139">main の .dynamic に DT_NEEDED を順に書く</text>

  <text class="s" x="30" y="190">ELF ファイルに固定される</text>
  <line x1="30" y1="198" x2="910" y2="198" stroke="#94a3b8" stroke-width="1.4" stroke-dasharray="7 4"/>
  <path class="a" d="M270 156 L270 232"/>

  <text class="ph" x="30" y="258">[起動時]</text>
  <rect x="170" y="232" width="200" height="44" rx="5" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.6"/>
  <text class="actor" x="270" y="259" text-anchor="middle">ld-linux.so</text>
  <text class="s" x="394" y="259">DT_NEEDED を依存の順にロード</text>

  <path class="a" d="M270 276 L270 398"/>
  <path class="a" d="M270 330 L390 330"/>

  <rect x="394" y="300" width="500" height="62" rx="5" fill="#fffbeb" stroke="#d97706" stroke-width="1.6"/>
  <text class="s" x="412" y="322">main の lookup scope 表を作る</text>
  <text class="mono" x="412" y="346">[0] main → [1] libmylib.so → [2] libc.so.6 → [3] ld-linux.so</text>

  <text class="ph" x="30" y="424">[初回関数呼び出し時]</text>
  <rect x="170" y="398" width="200" height="44" rx="5" fill="#ecfdf5" stroke="#059669" stroke-width="1.6"/>
  <text class="actor" x="270" y="425" text-anchor="middle">resolver</text>
  <text class="s" x="394" y="418">lookup scope を上から順に .dynsym で検索</text>
  <text class="s" x="394" y="438">→ libmylib.so で add を発見</text>
</svg>
